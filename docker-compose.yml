services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: lume
      POSTGRES_PASSWORD: lume
      POSTGRES_DB: lume
    ports:
      - "5432:5432"
    volumes:
      - lume_pg:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lume -d lume"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      LUME_DATABASE_URL: postgresql+psycopg://lume:lume@db:5432/lume
      LUME_JWT_SECRET: ${LUME_JWT_SECRET:-dev-only-change-me}
      LUME_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  lume_pg:

name: LUME CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:data-contract
      - run: npm test
      - name: npm run build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/next-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=next build failed::exit $status — last log lines follow"
            tail -n 60 /tmp/next-build.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$status"
          fi
